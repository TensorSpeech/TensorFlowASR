# Versioning, changelog, GitHub Release and PyPI upload, driven by conventional
# commit messages. See [tool.semantic_release] in pyproject.toml for the config.
# https://python-semantic-release.readthedocs.io

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the GitHub Release
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release needs full history and all tags to work out the
          # next version
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          # secrets.TOKEN is the private key of a deploy key with write access.
          # main is protected, so the release commit is pushed with this key.
          ssh-key: ${{ secrets.TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Bumps the version in pyproject.toml, updates CHANGELOG.md, commits and
      # tags locally. The action runs in its own Docker container, which has no
      # uv and no deploy key, so build, push and GitHub Release run in later steps.
      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build: false
          push: false
          vcs_release: false

      - name: Build
        if: steps.release.outputs.released == 'true'
        run: uv build

      - name: Push release commit and tag
        if: steps.release.outputs.released == 'true'
        run: git push origin "HEAD:${{ github.ref_name }}" "${{ steps.release.outputs.tag }}"

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        env:
          UV_PUBLISH_USERNAME: ${{ secrets.PYPI_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: uv publish

      - name: Create GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTES: ${{ steps.release.outputs.release_notes }}
        run: gh release create "$TAG" dist/* --title "$TAG" --notes "$NOTES"

      - name: Summary
        run: |
          if [ "${{ steps.release.outputs.released }}" = "true" ]; then
            echo "Released ${{ steps.release.outputs.version }} (\`${{ steps.release.outputs.tag }}\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.release.outputs.link }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release: no version-bumping commits since the last tag." >> "$GITHUB_STEP_SUMMARY"
          fi
